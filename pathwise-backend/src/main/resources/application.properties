spring.application.name=pathwise-backend

# Load environment variables from .env file
spring.config.import=optional:file:.env[.properties]

# Database Connection (variables loaded securely from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server Port
server.port=${PORT:8080}

# File Upload Limits (support up to 50MB handbooks)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage Configuration (loaded securely from .env if present)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:PathWise}

# Local Storage Fallback Path (active when Supabase URL/key not supplied)
storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# Admin Configuration (Loaded dynamically from environment variables in .env)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Spring Mail / Gmail SMTP Configuration (Loaded dynamically from environment variables in .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:pathwiseSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong1234567890}
app.jwt.access-token-expiration-ms=900000
