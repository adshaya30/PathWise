spring.application.name=pathwise-backend

# Load environment variables from .env file
spring.config.import=optional:file:.env[.properties]

# Database Connection (variables loaded securely from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hibernate Fast Batch Insert Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Database connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Close old connections before database/network closes them
spring.datasource.hikari.max-lifetime=600000

# Keep idle connections alive
spring.datasource.hikari.keepalive-time=120000

# Connection validation
spring.datasource.hikari.validation-timeout=5000

# Maximum time to wait for a connection
spring.datasource.hikari.connection-timeout=30000

# Server Port
server.port=${PORT:8080}

# File Upload Limits (support up to 50MB handbooks)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage Configuration (loaded securely from .env if present)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:PathWise}

# Local Storage Fallback Path (active when Supabase URL/key not supplied)
storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}

# Admin Configuration (Loaded dynamically from environment variables in .env)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Spring Mail / Gmail SMTP Configuration (Loaded dynamically from environment variables in .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# JWT Security Configuration (Loaded securely from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
app.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS:604800000}

# Google Gemini Vision AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
