spring.application.name=pathwise-backend

# Load environment variables from .env file
spring.config.import=optional:file:.env[.properties]

# Database Connection (variables loaded securely from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server Port
server.port=${PORT:8080}

# File Upload Limits (support up to 50MB handbooks)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Supabase Storage Configuration (loaded securely from .env if present)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:PathWise}

# Local Storage Fallback Path (active when Supabase URL/key not supplied)
storage.local.dir=${LOCAL_STORAGE_DIR:./uploads}
